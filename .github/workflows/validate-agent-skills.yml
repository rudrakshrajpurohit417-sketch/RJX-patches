name: Validate Agent Skills

on:
  workflow_dispatch:
  push:
    paths:
      - ".agents/skills/**"
      - ".github/workflows/validate-agent-skills.yml"
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".github/workflows/validate-agent-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate skill metadata and references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.agents/skills')
          skills = sorted(root.glob('*/SKILL.md'))
          if not skills:
              sys.exit('No Agent Skill SKILL.md files found under .agents/skills/')

          for path in skills:
              text = path.read_text(encoding='utf-8')
              match = re.match(r'\A---\s*\n(.*?)\n---\s*(?:\n|$)', text, re.S)
              if not match:
                  sys.exit(f'{path}: missing YAML frontmatter')
              front = match.group(1)
              name = re.search(r'^name:\s*([a-z0-9-]+)\s*$', front, re.M)
              description = re.search(r'^description:\s*(.+)\s*$', front, re.M)
              if not name or not description:
                  sys.exit(f'{path}: frontmatter requires name and description')
              if name.group(1) != path.parent.name:
                  sys.exit(f'{path}: name must match directory {path.parent.name!r}')
              if len(name.group(1)) > 64:
                  sys.exit(f'{path}: skill name exceeds 64 characters')
              if len(description.group(1).strip(' \"\'')) > 1024:
                  sys.exit(f'{path}: description exceeds 1024 characters')
              for link in re.findall(r'\]\((references/[^)]+)\)', text):
                  target = path.parent / link
                  if not target.is_file():
                      sys.exit(f'{path}: broken local reference {link}')
              print(f'OK: {path}')

          main_skill = Path('.agents/skills/morphe-to-reseam-porting/SKILL.md')
          if not main_skill.is_file():
              sys.exit('Missing original patch porting skill')
          main_text = main_skill.read_text(encoding='utf-8').lower()
          for required in ('never fabricate a replacement', 'behavior-coverage ledger', 'source-fidelity contract'):
              if required not in main_text:
                  sys.exit(f'Main skill is missing required rule: {required}')

          # Guard against reintroducing the previously used fake manifest patch
          # or a generic example patch as a substitute for an original port.
          forbidden_fragments = (
              'val examplemanifestchange',
              'minimal reseam shape',
              'package app.rjx.example',
              'application["android:debuggable"] = "true"',
          )
          for path in Path('.agents/skills').rglob('*.md'):
              text = path.read_text(encoding='utf-8').lower()
              for fragment in forbidden_fragments:
                  if fragment in text:
                      sys.exit(f'{path}: found prohibited placeholder/sample patch fragment {fragment!r}')

          print('OK: original-source and no-placeholder safeguards')
          PY
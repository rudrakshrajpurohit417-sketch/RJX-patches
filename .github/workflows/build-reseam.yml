name: Build Reseam bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - ".github/workflows/build-reseam.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RESEAM_BIN: ${{ github.workspace }}/engine/reseam
    steps:
      - name: Check out RJX patch sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get official Reseam template
        run: |
          git clone --depth 1 https://github.com/Reseam/patches-template.git "$RUNNER_TEMP/reseam-template"
          rm -rf "$RUNNER_TEMP/reseam-template/apps/example"
          mkdir -p "$RUNNER_TEMP/reseam-template/apps/adguard"
          cp -R apps/adguard/patch "$RUNNER_TEMP/reseam-template/apps/adguard/patch"
          cat > "$RUNNER_TEMP/reseam-template/manifest.toml" <<'EOF'
          [bundle]
          name = "rjx-patches"
          author = "RJX Mods"
          description = "RJX Reseam patches, starting with an AdGuard debugging test"
          format_version = 1
          EOF
          sed -i 's/rootProject.name = "example-patches"/rootProject.name = "rjx-patches"/' "$RUNNER_TEMP/reseam-template/settings.gradle.kts"

      - name: Install matching Reseam CLI
        working-directory: ${{ runner.temp }}/reseam-template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/engine"
          version=$(sed -n 's/.*id("app.reseam.workspace") version "\([^"]*\)".*/\1/p' settings.gradle.kts)
          test -n "$version"
          curl -fsSL -o "$RESEAM_BIN" "https://cdn.reseam.app/engine/v${version}/reseam-linux-x64"
          chmod +x "$RESEAM_BIN"

      - name: Build bundle
        working-directory: ${{ runner.temp }}/reseam-template
        run: ./gradlew --no-daemon bundle

      - name: Validate generated bundle
        run: "$RESEAM_BIN" bundle list "$RUNNER_TEMP/reseam-template/build/reseam/rjx-patches.reseam"

      - name: Upload Reseam bundle
        uses: actions/upload-artifact@v4
        with:
          name: rjx-patches-reseam-bundle
          path: ${{ runner.temp }}/reseam-template/build/reseam/*.reseam
          if-no-files-found: error
          retention-days: 14

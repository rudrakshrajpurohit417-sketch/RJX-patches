name: Build Reseam bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - ".github/workflows/build-reseam.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RJX patch sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Get official Reseam template
        run: |
          git clone --depth 1 https://github.com/Reseam/patches-template.git "$RUNNER_TEMP/reseam-template"
          rm -rf "$RUNNER_TEMP/reseam-template/apps/example"
          mkdir -p "$RUNNER_TEMP/reseam-template/apps/adguard"
          cp -R apps/adguard/patch "$RUNNER_TEMP/reseam-template/apps/adguard/patch"
          cat > "$RUNNER_TEMP/reseam-template/manifest.toml" <<'EOF'
          [bundle]
          name = "rjx-patches"
          author = "RJX Mods"
          description = "RJX Reseam patches, starting with an AdGuard debugging test"
          format_version = 1
          EOF
          sed -i 's/rootProject.name = "example-patches"/rootProject.name = "rjx-patches"/' "$RUNNER_TEMP/reseam-template/settings.gradle.kts"

      - name: Build bundle
        working-directory: ${{ runner.temp }}/reseam-template
        run: ./gradlew --no-daemon bundle

      - name: Upload Reseam bundle
        uses: actions/upload-artifact@v4
        with:
          name: rjx-patches-reseam-bundle
          path: ${{ runner.temp }}/reseam-template/build/reseam/*.reseam
          if-no-files-found: error
          retention-days: 14
